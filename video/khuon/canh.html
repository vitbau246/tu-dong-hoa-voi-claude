<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<style>
@font-face{font-family:BVP;src:url(../fonts/BeVietnamPro-Regular.ttf);font-weight:400}
@font-face{font-family:BVP;src:url(../fonts/BeVietnamPro-Medium.ttf);font-weight:500}
@font-face{font-family:BVP;src:url(../fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:JBM;src:url(../fonts/JetBrainsMono.ttf)}
:root{--nen:#0f172a;--the:#1e293b;--vien:#334155;--chu:#f8fafc;--phu:#cbd5e1;--mo:#94a3b8;--cam:#f97316;--xanh:#22c55e;--do:#ef4444;--tim:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--nen);color:var(--chu);font-family:BVP,sans-serif}
body{display:flex;flex-direction:column;padding:4.2vh 4.5vw 3vh}
.doc body{padding:6vh 6vw 4vh}
.dau{display:flex;justify-content:space-between;align-items:center;font-size:2.1vh;color:var(--mo);font-weight:500;letter-spacing:.02em}
.dau b{color:var(--cam)}
.doc .dau{flex-direction:column;align-items:flex-start;gap:1.4vh;font-size:2vh}
.huy-hieu{padding:.6vh 1.2vh;border-radius:99px;border:2px solid var(--vien);font-size:1.7vh}
.huy-hieu.that{border-color:var(--xanh);color:var(--xanh)}
.buoc{display:flex;gap:1.2vw;margin-top:2.2vh}
.buoc span{flex:1;padding:1vh 1.2vw;border-radius:1vh;background:var(--the);color:var(--mo);font-size:1.9vh;font-weight:500}
.buoc span.on{background:var(--cam);color:#fff}
.buoc span.xong{color:var(--phu)}
.than{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3vh;padding:2vh 0 19vh}
.doc .than{padding-bottom:17vh}
h1{font-size:8.5vh;line-height:1.12;font-weight:700}
.doc h1{font-size:5.6vh}
h1 em{font-style:normal;color:var(--cam)}
h2{font-size:4.6vh;font-weight:700;line-height:1.2}
.doc h2{font-size:3.6vh}
.phu{font-size:3.4vh;color:var(--phu);line-height:1.45}
.doc .phu{font-size:2.7vh}
.nhan{display:inline-block;align-self:flex-start;background:var(--cam);color:#fff;font-weight:700;padding:.8vh 1.8vh;border-radius:1vh;font-size:2.4vh;letter-spacing:.04em}
.khung{background:var(--the);border:2px solid var(--vien);border-radius:2vh;padding:3vh 2.4vw}
.prompt{font-family:JBM,BVP,monospace;font-size:2.55vh;line-height:1.55;white-space:pre-wrap;color:#e2e8f0}
.doc .prompt{font-size:2vh}
.prompt-nhan{font-size:1.9vh;color:var(--cam);font-weight:700;margin-bottom:1.4vh;letter-spacing:.08em}
.claude{display:flex;gap:1.6vw;align-items:flex-start}
.sao{flex:none;width:6vh;height:6vh;border-radius:1.4vh;background:#d97757;display:grid;place-items:center;font-size:3.6vh;color:#fff;font-weight:700}
.claude .noi{font-size:2.75vh;line-height:1.55;color:#e2e8f0}
.doc .claude .noi{font-size:2.1vh}
.claude .noi p{margin-bottom:1.3vh}.claude .noi b{color:#fff}.claude .noi code{font-family:JBM,monospace;color:var(--cam);font-size:.92em}
table{width:100%;border-collapse:collapse;font-size:2.7vh}
.doc table{font-size:2vh}
th,td{padding:.95vh 1.2vw;border-bottom:2px solid var(--vien);text-align:left}
th:not(:first-child),td:not(:first-child){text-align:right}
th{color:var(--mo);font-weight:500;font-size:.85em}
td.so{text-align:right;font-family:JBM,monospace}
tr.noi td{color:var(--cam);font-weight:700}
.hai-cot{display:grid;grid-template-columns:1fr 1fr;gap:2.4vw}
.doc .hai-cot{grid-template-columns:1fr;gap:2vh}
.cay{font-family:JBM,monospace;font-size:2.2vh;line-height:1.55;white-space:pre;color:#e2e8f0;overflow:hidden}
.doc .cay{font-size:1.75vh}
.cay-tieu-de{font-family:BVP;font-size:2.4vh;font-weight:700;margin-bottom:1.2vh}
.do{color:var(--do)}.xanh{color:var(--xanh)}.cam{color:var(--cam)}
ul.ds{list-style:none;display:flex;flex-direction:column;gap:2.2vh}
ul.ds li{font-size:3.4vh;line-height:1.35;display:flex;gap:1.2vw;align-items:baseline}
.doc ul.ds li{font-size:2.7vh}
ul.ds li::before{content:"";flex:none;width:1.6vh;height:1.6vh;border-radius:.4vh;background:var(--cam);transform:translateY(-.3vh)}
.so-lieu{display:flex;gap:2.4vw;flex-wrap:wrap}
.so-lieu div{flex:1;min-width:22vh;background:var(--the);border:2px solid var(--vien);border-radius:2vh;padding:3vh 2vw}
.so-lieu b{display:block;font-size:8vh;color:var(--cam);line-height:1;font-weight:700}
.doc .so-lieu b{font-size:6vh}
.so-lieu span{display:block;margin-top:1.4vh;font-size:2.5vh;color:var(--phu)}
.canh-bao{border-left:1.2vh solid var(--cam);padding-left:2vw}
.ket{align-items:flex-start}
.cta{display:inline-block;margin-top:2vh;background:var(--cam);color:#fff;font-weight:700;font-size:3.2vh;padding:1.8vh 3vh;border-radius:1.4vh}
.chu-ky{font-size:2.6vh;color:var(--mo)}
</style></head>
<body><div id="goc" style="display:contents"></div>
<script>
const e = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// **đậm**, `mã`, *nhấn* (màu cam) trong chuỗi
const md = s => e(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/\n/g,"<br>");
window.render = (c, meta) => {
  document.documentElement.className = innerHeight > innerWidth ? "doc" : "ngang";
  const buoc = meta.buoc ? `<div class="buoc">${meta.buoc.map((b,i)=>`<span class="${i===c.buoc?'on':(i<c.buoc?'xong':'')}">${e(b)}</span>`).join("")}</div>` : "";
  const doc = innerHeight > innerWidth;
  const hh = c.that ? `<span class="huy-hieu that">● ${doc ? "Phiên chạy thật" : "Dữ liệu từ phiên chạy thật"} · Claude Code ${e(meta.phien_ban)}</span>` : `<span class="huy-hieu">Minh họa</span>`;
  let t = "";
  switch (c.loai) {
    case "hook": t = `${c.nhan?`<span class="nhan">${e(c.nhan)}</span>`:""}<h1>${md(c.tieu_de)}</h1>${c.phu?`<div class="phu">${md(c.phu)}</div>`:""}`; break;
    case "the": t = `${c.nhan?`<span class="nhan">${e(c.nhan)}</span>`:""}<h2>${md(c.tieu_de)}</h2>${c.noi_dung?`<div class="phu">${md(c.noi_dung)}</div>`:""}`; break;
    case "prompt": t = `${c.tieu_de?`<h2>${md(c.tieu_de)}</h2>`:""}<div class="khung"><div class="prompt-nhan">PROMPT${c.che_do?" · CHẾ ĐỘ "+e(c.che_do):""}</div><div class="prompt">${e(c.prompt)}</div></div>`; break;
    case "claude": t = `${c.tieu_de?`<h2>${md(c.tieu_de)}</h2>`:""}<div class="khung claude"><div class="sao">✳</div><div class="noi">${c.doan.map(p=>`<p>${md(p)}</p>`).join("")}</div></div>`; break;
    case "bang": t = `<h2>${md(c.tieu_de)}</h2><div class="khung"><table><tr>${c.cot.map(x=>`<th>${e(x)}</th>`).join("")}</tr>${c.dong.map((r,i)=>`<tr class="${(c.noi||[]).includes(i)?'noi':''}">${r.map(x=>`<td class="${/^[\d.,%+\- ]+$/.test(String(x))?'so':''}">${md(x)}</td>`).join("")}</tr>`).join("")}</table></div>`; break;
    case "cay": t = `${c.tieu_de?`<h2>${md(c.tieu_de)}</h2>`:""}<div class="hai-cot">${c.cot.map(k=>`<div class="khung"><div class="cay-tieu-de ${k.mau||''}">${e(k.tieu_de)}</div><div class="cay">${e(k.dong.join("\n"))}</div></div>`).join("")}</div>`; break;
    case "danh-sach": t = `<h2>${md(c.tieu_de)}</h2><ul class="ds">${c.muc.map(x=>`<li><span>${md(x)}</span></li>`).join("")}</ul>`; break;
    case "so-lieu": t = `${c.tieu_de?`<h2>${md(c.tieu_de)}</h2>`:""}<div class="so-lieu">${c.muc.map(([s,n])=>`<div><b>${e(s)}</b><span>${md(n)}</span></div>`).join("")}</div>`; break;
    case "canh-bao": t = `<div class="canh-bao"><span class="nhan">${e(c.nhan||"⚠ LƯU Ý")}</span><h2 style="margin-top:2vh">${md(c.tieu_de)}</h2>${c.noi_dung?`<div class="phu" style="margin-top:2vh">${md(c.noi_dung)}</div>`:""}</div>`; break;
    case "ket": t = `<h1>${md(c.tieu_de)}</h1>${c.phu?`<div class="phu">${md(c.phu)}</div>`:""}${c.cta?`<span class="cta">${e(c.cta)}</span>`:""}<div class="chu-ky">FoxFlow · 5 phút tự động hóa</div>`; break;
  }
  document.getElementById("goc").innerHTML =
    `<div class="dau"><span><b>5 phút tự động hóa</b> · ${e(meta.tap)}</span>${hh}</div>${buoc}<div class="than ${c.loai==='ket'?'ket':''}">${t}</div>`;
};
</script></body></html>
